name: Build CARDIZ ONE

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

jobs:
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure Intel macOS
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Ad-hoc sign macOS plug-ins
        run: |
          codesign --force --deep --sign - "build/CardizOne_artefacts/Release/VST3/CARDIZ ONE.vst3"
          codesign --force --deep --sign - "build/CardizOne_artefacts/Release/AU/CARDIZ ONE.component"
      - name: Package VST3 and AU
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/CardizOne_artefacts/Release/VST3/CARDIZ ONE.vst3" "dist/CARDIZ_ONE_macOS_Intel_VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/CardizOne_artefacts/Release/AU/CARDIZ ONE.component" "dist/CARDIZ_ONE_macOS_Intel_AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CARDIZ-ONE-macOS-Intel
          path: dist/*

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "build/CardizOne_artefacts/Release/VST3/CARDIZ ONE.vst3" -DestinationPath "dist/CARDIZ_ONE_Windows_x64_VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CARDIZ-ONE-Windows-x64
          path: dist/*
